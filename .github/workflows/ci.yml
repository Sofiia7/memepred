name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '9.12.0'

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. SMART CONTRACTS — forge fmt + build + test
  # ─────────────────────────────────────────────────────────────
  contracts:
    name: contracts (forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: forge fmt --check
        working-directory: contracts
        run: forge fmt --check

      - name: forge build (sizes)
        working-directory: contracts
        run: forge build --sizes

      - name: forge test
        working-directory: contracts
        run: forge test -vv

  # ─────────────────────────────────────────────────────────────
  # 1b. SMART CONTRACTS — Slither static analysis (informational —
  #     not in ci-passed's `needs`, so a new finding warns without
  #     blocking merges; review findings manually before mainnet).
  # ─────────────────────────────────────────────────────────────
  contracts-slither:
    name: contracts (slither, informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: stable }

      - name: Install Slither
        run: pip3 install slither-analyzer

      - name: slither
        working-directory: contracts
        run: slither . --foundry-ignore-compile=false || true

  # ─────────────────────────────────────────────────────────────
  # 2. BACKEND — tsc typecheck + unit tests + DB migration smoke test
  # ─────────────────────────────────────────────────────────────
  backend:
    name: backend (tsc + db-smoke)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: flipthememe
          POSTGRES_PASSWORD: flipthememe
          POSTGRES_DB: flipthememe_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flipthememe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://flipthememe:flipthememe@localhost:5432/flipthememe_ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        working-directory: backend
        run: pnpm exec tsc --noEmit

      - name: unit tests
        working-directory: backend
        run: pnpm exec vitest run

      - name: db migration smoke
        run: node scripts/ci-db-smoke.mjs

  # ─────────────────────────────────────────────────────────────
  # 3. FRONTEND — tsc + vite build
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: frontend (tsc + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        working-directory: frontend
        # Plain --noEmit (not build mode): `tsc -b --noEmit` conflicts with the
        # composite tsconfig.node.json (TS6310). vite build below is the real
        # build gate; this just typechecks src against tsconfig.json.
        run: pnpm exec tsc --noEmit

      - name: unit tests
        working-directory: frontend
        run: pnpm exec vitest run

      - name: vite build
        working-directory: frontend
        env:
          # Build-time placeholders so vite doesn't fail on missing envs.
          # Real values are injected at deploy time.
          VITE_NETWORK: sepolia
          VITE_BASE_RPC_URL: https://sepolia.base.org
          VITE_USDC_ADDRESS: '0x0000000000000000000000000000000000000001'
          VITE_MARKET_FACTORY: '0x0000000000000000000000000000000000000002'
          VITE_ORACLE_RESOLVER: '0x0000000000000000000000000000000000000003'
          VITE_FEE_DISTRIBUTOR: '0x0000000000000000000000000000000000000004'
          VITE_REFERRAL_REGISTRY: '0x0000000000000000000000000000000000000005'
          VITE_BADGE_NFT: '0x0000000000000000000000000000000000000006'
          VITE_LIQUIDITY_POOL: '0x0000000000000000000000000000000000000007'
          VITE_GENESIS_NFT: '0x0000000000000000000000000000000000000008'
          VITE_API_URL: https://api.example.test
          VITE_GRAPH_URL: https://example.test/subgraph
          VITE_PYTH_HERMES: https://hermes.pyth.network
        run: pnpm exec vite build

  # ─────────────────────────────────────────────────────────────
  # 4. SUBGRAPH — graph codegen + build
  # ─────────────────────────────────────────────────────────────
  subgraph:
    name: subgraph (graph build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: graph codegen
        working-directory: subgraph
        run: pnpm exec graph codegen

      - name: graph build
        working-directory: subgraph
        run: pnpm exec graph build

  # ─────────────────────────────────────────────────────────────
  # 4b. WORKERS — the edge geo-block and the off-box watchdog.
  #     Nothing checked these at all until now, while the three most
  #     recent commits on this branch were all watchdog bugfixes and the
  #     watchdog is the only thing that notices production dying.
  # ─────────────────────────────────────────────────────────────
  workers:
    name: workers (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        working-directory: workers
        run: pnpm run typecheck

  # ─────────────────────────────────────────────────────────────
  # 5. DEPENDENCY AUDIT — informational only (not in ci-passed's
  #    `needs`). A new transitive-dep advisory shouldn't silently block
  #    an unrelated hotfix merge; review findings manually instead.
  # ─────────────────────────────────────────────────────────────
  dependency-audit:
    name: dependency audit (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }

      # This job used to run `npm audit` with no install step and no committed
      # npm lockfile, so npm exited ENOLEC every time and `|| true` swallowed
      # it. Permanently green, auditing nothing - the repo's only automated
      # supply-chain check had never actually run. It needs the install.
      - name: install (for the lockfile audit reads)
        run: pnpm install --frozen-lockfile

      - name: audit the workspace
        run: pnpm audit --audit-level high || true

  # ─────────────────────────────────────────────────────────────
  # Aggregator job — required-status target for branch protection
  # ─────────────────────────────────────────────────────────────
  ci-passed:
    name: ci-passed
    if: always()
    needs: [contracts, backend, frontend, subgraph, workers]
    runs-on: ubuntu-latest
    steps:
      - name: assert all green
        run: |
          if [ "${{ needs.contracts.result }}" != "success" ] \
          || [ "${{ needs.backend.result   }}" != "success" ] \
          || [ "${{ needs.frontend.result  }}" != "success" ] \
          || [ "${{ needs.subgraph.result  }}" != "success" ]           || [ "${{ needs.workers.result   }}" != "success" ]; then
            echo "one or more jobs failed"
            exit 1
          fi
          echo "all green"
