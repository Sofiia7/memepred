[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# via_ir disabled due to Yul stack-too-deep with OZ ERC1155

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    # RedStone ships its consumer contracts only on npm - they are excluded from
    # their public GitHub monorepo, so forge install cannot reach them. Declared
    # in package.json and remapped here rather than copied into src/.
    "@redstone-finance/evm-connector/=node_modules/@redstone-finance/evm-connector/"
]

[profile.default.fuzz]
runs = 1000
max_test_rejects = 65536

[rpc_endpoints]
base_mainnet = "${BASE_RPC_URL}"
base_sepolia  = "https://sepolia.base.org"
# Robinhood Chain. The public endpoints are rate limited and keep only ~8
# minutes of state, so they serve scripts and eth_call but cannot back a
# pinned-block fork test; see docs/rhc/measurements.
rhc_mainnet = "https://rpc.mainnet.chain.robinhood.com"
rhc_testnet = "https://rpc.testnet.chain.robinhood.com"

[etherscan]
base = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api" }
