# FlipTheMeme — single-VPS production stack.
# Boots Postgres (TimescaleDB), Redis, the API, the keeper, and Caddy (HTTPS reverse proxy).
#
# Usage:
#   cp .env.example .env       # fill in
#   docker compose up -d
#   docker compose logs -f
#
# Backups run inside the stack (see the db-backup service). scripts/backup-db.sh
# is still there for a manual dump from the host.

# Docker's json-file driver is unbounded by default. The keeper logs the whole
# viem error object — Pyth calldata included, ~10 kB — on every failed tx, so a
# single stuck transaction retrying on a timer wrote 4 GB in 3 days and would
# have filled the disk (and taken down the other project sharing this VPS)
# in about a month. Cap every service; 20 MB x 5 files is far more history
# than anyone reads, and bounds the whole stack at ~500 MB.
# Memory ceilings on every service. This VPS is shared with an unrelated site,
# and nothing here was bounded: a keeper leak or a Postgres runaway would take
# the neighbour down with it. Sized against measured idle use with room to
# spare, not tuned - the point is that a ceiling exists.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    mem_limit: 1g
    logging: *default-logging
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-memepred}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-memepred}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-memepred}"]
      interval: 5s
      timeout:  3s
      retries:  10
    # Bind only to localhost to keep DB off the public internet.
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    mem_limit: 256m
    logging: *default-logging
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    mem_limit: 768m
    logging: *default-logging
    build:
      context:    ../backend
      dockerfile: ../deploy/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_started }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-memepred}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-memepred}
      REDIS_URL:    redis://default:${REDIS_PASSWORD}@redis:6379
      PORT:         "3001"
      BASE_RPC_URL: ${BASE_RPC_URL}
      REDSTONE_GATEWAY_URL:  ${REDSTONE_GATEWAY_URL:-https://oracle-gateway-1.a.redstone.finance}
      CHAIN_ID:           ${CHAIN_ID:-84532}
      WORKER_SECRET:      ${WORKER_SECRET}
      # Read by src/index.ts. Never reached the container before, so the CORS
      # allowlist silently stayed on its built-in default, localhost included.
      ALLOWED_ORIGINS:    ${ALLOWED_ORIGINS}
      USDC_ADDRESS:       ${USDC_ADDRESS}
      MARKET_FACTORY:     ${MARKET_FACTORY}
      ORACLE_RESOLVER:    ${ORACLE_RESOLVER}
      FEE_DISTRIBUTOR:    ${FEE_DISTRIBUTOR}
      REFERRAL_REGISTRY:  ${REFERRAL_REGISTRY}
      LIQUIDITY_POOL:     ${LIQUIDITY_POOL}
      GENESIS_NFT:        ${GENESIS_NFT}
      BADGE_NFT:          ${BADGE_NFT}
    ports:
      - "127.0.0.1:3001:3001"

  keeper:
    mem_limit: 768m
    logging: *default-logging
    build:
      context:    ../backend
      dockerfile: ../deploy/backend.Dockerfile
    command: ["node", "dist/keeper/index.js"]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_started }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-memepred}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-memepred}
      REDIS_URL:    redis://default:${REDIS_PASSWORD}@redis:6379
      BASE_RPC_URL: ${BASE_RPC_URL}
      REDSTONE_GATEWAY_URL:  ${REDSTONE_GATEWAY_URL:-https://oracle-gateway-1.a.redstone.finance}
      USDC_ADDRESS:              ${USDC_ADDRESS}
      MARKET_FACTORY:            ${MARKET_FACTORY}
      ORACLE_RESOLVER:           ${ORACLE_RESOLVER}
      FEE_DISTRIBUTOR:           ${FEE_DISTRIBUTOR}
      REFERRAL_REGISTRY:         ${REFERRAL_REGISTRY}
      LIQUIDITY_POOL:            ${LIQUIDITY_POOL}
      KEEPER_PRIVATE_KEY:        ${KEEPER_PRIVATE_KEY}
      # badgeService reads BADGE_MINTER_KEY; this was passed under a third
      # name that nothing looks up, so the container held a hot-wallet key it
      # could not use and the service would have found none.
      BADGE_MINTER_KEY:          ${BADGE_MINTER_KEY}
      INDEXER_START_BLOCK:       ${INDEXER_START_BLOCK}
      CHAIN_ID:                  ${CHAIN_ID:-84532}

  # Hourly pg_dump, as part of the stack rather than as a line in somebody's
  # crontab. The script in ./scripts existed for months and was never
  # scheduled - the only cron on this host backed up a different project - so
  # the orders and matches history had no copy at all. A backup that depends on
  # remembering to install it is not a backup.
  #
  # Dumps over the network to the postgres service rather than shelling out
  # through `docker compose exec`, so this needs no access to the docker
  # socket. Same major version as the server, or pg_dump refuses.
  db-backup:
    mem_limit: 256m
    logging: *default-logging
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST:     postgres
      PGUSER:     ${POSTGRES_USER:-memepred}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-memepred}
    volumes:
      - ./backups:/backups
    # Written to .part and moved into place only on success, so a dump that
    # dies halfway can never be mistaken for a good one by the pruner or by
    # whoever is restoring at 3am. Kept 30 days.
    command: >
      sh -c 'while true; do
        ts=$$(date -u +%Y%m%d-%H%M%S);
        if pg_dump | gzip > "/backups/flipthememe-$$ts.sql.gz.part"; then
          mv "/backups/flipthememe-$$ts.sql.gz.part" "/backups/flipthememe-$$ts.sql.gz";
          echo "backup ok: flipthememe-$$ts.sql.gz";
        else
          echo "backup FAILED at $$ts"; rm -f "/backups/flipthememe-$$ts.sql.gz.part";
        fi;
        find /backups -name "flipthememe-*.sql.gz" -mmin +43200 -delete;
        find /backups -name "*.sql.gz.part"        -mmin +180   -delete;
        sleep 3600;
      done'

  caddy:
    mem_limit: 128m
    logging: *default-logging
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      API_DOMAIN:         ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
