# FlipTheMeme — single-VPS production stack.
# Boots Postgres (TimescaleDB), Redis, the API, the keeper, and Caddy (HTTPS reverse proxy).
#
# Usage:
#   cp .env.example .env       # fill in
#   docker compose up -d
#   docker compose logs -f
#
# Backups: see ./scripts/backup-db.sh (cron-friendly).

# Docker's json-file driver is unbounded by default. The keeper logs the whole
# viem error object — Pyth calldata included, ~10 kB — on every failed tx, so a
# single stuck transaction retrying on a timer wrote 4 GB in 3 days and would
# have filled the disk (and taken down the other project sharing this VPS)
# in about a month. Cap every service; 20 MB x 5 files is far more history
# than anyone reads, and bounds the whole stack at ~500 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    logging: *default-logging
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-memepred}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-memepred}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-memepred}"]
      interval: 5s
      timeout:  3s
      retries:  10
    # Bind only to localhost to keep DB off the public internet.
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    logging: *default-logging
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    logging: *default-logging
    build:
      context:    ../backend
      dockerfile: ../deploy/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_started }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-memepred}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-memepred}
      REDIS_URL:    redis://default:${REDIS_PASSWORD}@redis:6379
      PORT:         "3001"
      BASE_RPC_URL: ${BASE_RPC_URL}
      REDSTONE_GATEWAY_URL:  ${REDSTONE_GATEWAY_URL:-https://oracle-gateway-1.a.redstone.finance}
      CHAIN_ID:           ${CHAIN_ID:-84532}
      WORKER_SECRET:      ${WORKER_SECRET}
      # Read by src/index.ts. Never reached the container before, so the CORS
      # allowlist silently stayed on its built-in default, localhost included.
      ALLOWED_ORIGINS:    ${ALLOWED_ORIGINS}
      USDC_ADDRESS:       ${USDC_ADDRESS}
      MARKET_FACTORY:     ${MARKET_FACTORY}
      ORACLE_RESOLVER:    ${ORACLE_RESOLVER}
      FEE_DISTRIBUTOR:    ${FEE_DISTRIBUTOR}
      REFERRAL_REGISTRY:  ${REFERRAL_REGISTRY}
      LIQUIDITY_POOL:     ${LIQUIDITY_POOL}
      GENESIS_NFT:        ${GENESIS_NFT}
      BADGE_NFT:          ${BADGE_NFT}
    ports:
      - "127.0.0.1:3001:3001"

  keeper:
    logging: *default-logging
    build:
      context:    ../backend
      dockerfile: ../deploy/backend.Dockerfile
    command: ["node", "dist/keeper/index.js"]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_started }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-memepred}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-memepred}
      REDIS_URL:    redis://default:${REDIS_PASSWORD}@redis:6379
      BASE_RPC_URL: ${BASE_RPC_URL}
      REDSTONE_GATEWAY_URL:  ${REDSTONE_GATEWAY_URL:-https://oracle-gateway-1.a.redstone.finance}
      USDC_ADDRESS:              ${USDC_ADDRESS}
      MARKET_FACTORY:            ${MARKET_FACTORY}
      ORACLE_RESOLVER:           ${ORACLE_RESOLVER}
      FEE_DISTRIBUTOR:           ${FEE_DISTRIBUTOR}
      REFERRAL_REGISTRY:         ${REFERRAL_REGISTRY}
      LIQUIDITY_POOL:            ${LIQUIDITY_POOL}
      KEEPER_PRIVATE_KEY:        ${KEEPER_PRIVATE_KEY}
      # badgeService reads BADGE_MINTER_KEY; this was passed under a third
      # name that nothing looks up, so the container held a hot-wallet key it
      # could not use and the service would have found none.
      BADGE_MINTER_KEY:          ${BADGE_MINTER_KEY}
      INDEXER_START_BLOCK:       ${INDEXER_START_BLOCK}
      CHAIN_ID:                  ${CHAIN_ID:-84532}

  caddy:
    logging: *default-logging
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      API_DOMAIN:         ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
