# Added to the existing RHC compose project. Uses its already built runtime
# (viem is installed), mounts only public code/config, and sends no transactions.
services:
  rhc-demo-watch:
    image: ${RHC_RUNTIME_IMAGE:-deploy-rhc-keeper}
    restart: unless-stopped
    mem_limit: 192m
    command: ["node", "/app/rhc-continuous-demo-watch.mjs"]
    volumes:
      - /home/openclaw/memepred-rhc/backend/scripts/rhc-continuous-demo-watch.mjs:/app/rhc-continuous-demo-watch.mjs:ro
      - /home/openclaw/memepred-rhc/continuous-demo-pools.json:/app/continuous-demo-pools.json:ro
    ports:
      - "127.0.0.1:3003:9090"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9090').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
