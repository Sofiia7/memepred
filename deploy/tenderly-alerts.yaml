# Sprint 5.4 — Tenderly alert manifest
#
# Import into Tenderly: Dashboard → Alerts → Import.
#
# 2026-07-07: contract addresses below are filled in from the live Sepolia
# deploy (factory 0x77cb2EE5..., see project memory.md for the full set).
# Only ${DISCORD_WEBHOOK_URL} is still a placeholder — create a webhook in
# your Discord server (Server Settings → Integrations → Webhooks → New
# Webhook → copy URL) and paste it below. PagerDuty is optional (delete the
# pagerduty lines/`delivery: [..., pagerduty]` entries if you don't have one)
# — Discord alone is enough to not silently miss a paused market or a
# drained LP vault.

project: flipthememe
network: base-sepolia            # change to "base" once redeployed to mainnet
deliveryChannels:
  discord:
    url: ${DISCORD_WEBHOOK_URL}   # <- paste your Discord webhook URL here
  pagerduty:
    integrationKey: ${PAGERDUTY_KEY}  # optional, leave blank if unused

alerts:
  - name: MarketRefunded — emergency refund triggered
    description: A match was emergency-refunded (oracle/keeper failure).
    severity: high
    expression:
      type: event_emitted
      contract: 0x5f05688B0De438A9B9f5Df65233AEEA5EC1Ce74f
      event: MarketRefunded(address,string)
    delivery: [discord, pagerduty]

  - name: OrderbookMarket paused
    description: A market was paused (auto by emergencyPauser, or by multisig).
    severity: critical
    expression:
      type: event_emitted
      anyContract: true        # any OrderbookMarket clone
      event: Paused(address)
    delivery: [discord, pagerduty]

  - name: Fee changed on a market
    description: Multisig executed applyNewFee.
    severity: info
    expression:
      type: event_emitted
      anyContract: true
      event: FeeChanged(uint256)
    delivery: [discord]

  - name: Large LP withdrawal (>10% of vault)
    description: A withdrawal that drained > 10% of LP vault in a single tx.
    severity: high
    expression:
      type: event_emitted
      contract: 0x135a31E7F1b24Bf60A65696961A4807410E6d81C
      event: Withdraw(address,address,address,uint256,uint256)
      filter:
        # >10% of totalAssets at the time of the event
        condition: assets > totalAssets() * 0.10
    delivery: [discord]

  - name: OracleResolver ETH balance low
    description: Resolver ETH < 0.05 ETH (Pyth fees will start to fail soon).
    severity: high
    expression:
      type: balance_below
      address: 0x5f05688B0De438A9B9f5Df65233AEEA5EC1Ce74f
      thresholdEth: 0.05
    delivery: [discord]

  - name: OracleResolver ETH balance critical
    description: Resolver ETH < 0.005 ETH (next settle WILL fail).
    severity: critical
    expression:
      type: balance_below
      address: 0x5f05688B0De438A9B9f5Df65233AEEA5EC1Ce74f
      thresholdEth: 0.005
    delivery: [discord, pagerduty]

  - name: Multisig ownership change
    description: Any contract's owner transferred away from the multisig.
    severity: critical
    expression:
      type: event_emitted
      anyContract: true
      event: OwnershipTransferred(address,address)
      filter:
        condition: previousOwner == "0xAA1a14ad2f57fc79Ac14b2Cf5e2968Fdaeb9047F"
    delivery: [discord, pagerduty]

  - name: Emergency pauser changed
    description: MarketFactory emergencyPauser address rotated.
    severity: high
    expression:
      type: event_emitted
      contract: 0x77cb2EE5695CfFD3bD2043afe7eb910Ec0fe71b0
      event: EmergencyPauserSet(address)
    delivery: [discord]
