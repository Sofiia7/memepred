# Deployed separately from geo-block.ts on purpose: that Worker is attached to
# a route on api.flipthememe.com and shares the fate of anything that breaks
# the zone. The watchdog has to be able to report on a broken zone, so it runs
# cron-only on workers.dev with no route of its own.
#
#   wrangler deploy -c wrangler.watchdog.toml
name = "flipthememe-watchdog"
main = "watchdog.ts"
compatibility_date = "2024-09-01"
workers_dev = true

# What this worker watches. Unset means the Base production hosts, so an
# existing deployment keeps watching exactly what it watched before.
#
# One worker per deployment: a second chain's backend needs its own copy of this
# file with its own name, API_HOST and KV namespace. A single worker pointed at
# two hosts would page without saying which is down, and the alert body is the
# whole product of a monitor.
[vars]
# API_HOST   = "api.flipthememe.com"
# SITE_HOST  = "flipthememe.com"
# DEPLOYMENT = "base"

[triggers]
# Every 2 minutes; two consecutive misses page, so an outage surfaces in ~4 min.
crons = ["*/2 * * * *"]

[[kv_namespaces]]
binding = "WATCHDOG"
id = "9216c3cbe9f44ceab3abe3b10d2bc06e"

# Optional alert channels - set whichever you use, the Worker skips the rest:
#   wrangler secret put TELEGRAM_BOT_TOKEN -c wrangler.watchdog.toml
#   wrangler secret put TELEGRAM_CHAT_ID   -c wrangler.watchdog.toml
#   wrangler secret put ALERT_WEBHOOK_URL  -c wrangler.watchdog.toml
