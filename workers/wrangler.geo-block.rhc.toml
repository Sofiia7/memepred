# The edge router for the Robinhood Chain deployment - same geo-block.ts
# code as the Base worker (wrangler.toml), pointed at a different route and
# given its own WORKER_SECRET, because the RHC backend is a separate origin
# with its own secret, not a second copy of Base's.
#
#   wrangler deploy -c wrangler.geo-block.rhc.toml
#
# Status (2026-09-29). Steps 2 and 3 are DONE; only step 1 is missing:
#   1. DNS record for api-rhc.flipthememe.com in the flipthememe.com zone
#      (Proxied/orange-cloud), same as api.flipthememe.com already has -
#      the route below cannot attach until this exists. NOT DONE: the wrangler
#      token available so far has no zone/DNS scope.
#   2. DONE. Caddy on the VPS reverse-proxies that hostname to rhc-backend:3002
#      (site block lives in the live Caddyfile on the VPS, see deploy/README.md
#      section 11 for why it is not simply the repo file).
#   3. DONE. `wrangler secret put WORKER_SECRET -c wrangler.geo-block.rhc.toml`
#      with the value that is also in the RHC backend's .env.rhc (its own
#      secret, not Base's).
name = "flipthememe-edge-rhc"
main = "geo-block.ts"
compatibility_date = "2024-09-01"

routes = [
  { pattern = "api-rhc.flipthememe.com/*", zone_name = "flipthememe.com" }
]

# 2026-09-29, Sofia's decision: Singapore is open on THIS deployment, because it
# is the testnet demo for the Arbitrum Open House Singapore buildathon and its
# judges may be there. The Base worker (wrangler.toml) has no such variable and
# keeps the full restricted list - opening a country there is a separate
# decision, it carries real money. Only restricted jurisdictions can be opened
# this way; OFAC countries are ignored by design (see blockedFor in
# geo-block.ts). Keep it identical to VITE_GEO_OPEN_COUNTRIES in the frontend
# build of this deployment, or the page copy and the edge will disagree.
[vars]
GEO_OPEN_COUNTRIES = "SG"
