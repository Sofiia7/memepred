name = "flipthememe-edge"
main = "geo-block.ts"
compatibility_date = "2024-09-01"

# 2026-07-07: api.flipthememe.com's existing A record (-> VPS) is now
# Proxied (orange cloud) in Cloudflare, so a plain Route (not "custom
# domain", which would have Cloudflare try to manage/create its own DNS
# record for the hostname) attaches this Worker in front of that already-
# proxied record without touching DNS further.
routes = [
  { pattern = "api.flipthememe.com/*", zone_name = "flipthememe.com" }
]

# WORKER_SECRET must be set with:
#   wrangler secret put WORKER_SECRET
# It must equal backend's WORKER_SECRET env var.
